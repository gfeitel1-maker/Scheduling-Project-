<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tile World — Shoresh</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0f1e0a; overflow: hidden;
    display: flex; flex-direction: column; height: 100vh;
    font-family: system-ui, -apple-system, sans-serif;
  }
  #toolbar {
    flex-shrink: 0; height: 48px; z-index: 10;
    background: rgba(8,16,6,0.92); border-bottom: 1px solid rgba(255,255,255,0.07);
    display: flex; align-items: center; gap: 14px; padding: 0 18px; color: #eee;
  }
  .wordmark { font-size: 11px; font-weight: 700; color: #4a7a5a; letter-spacing: .14em; text-transform: uppercase; }
  .sep { width: 1px; height: 18px; background: rgba(255,255,255,0.1); }
  #period-label { font-size: 14px; font-weight: 600; color: #e8e0cc; }
  #day-label { font-size: 12px; color: #555; }
  #ws-status { margin-left: auto; font-size: 11px; }
  #ws-status.ok  { color: #3a9; }
  #ws-status.err { color: #944; }
  #game-container { flex: 1; }
</style>
</head>
<body>
<div id="toolbar">
  <span class="wordmark">Shoresh</span>
  <div class="sep"></div>
  <span id="period-label">—</span>
  <span id="day-label"></span>
  <span id="ws-status" class="err">● Connecting…</span>
</div>
<div id="game-container"></div>

<script>
const WS_PORT = __WS_PORT__
const ASSETS  = '/tileworld-assets'

// ── Seeded LCG RNG ────────────────────────────────────────────────────────────
function makeRng(seed) {
  let s = seed >>> 0
  return () => { s = (Math.imul(1664525, s) + 1013904223) >>> 0; return s / 0xffffffff }
}

// ── Group colour palette ──────────────────────────────────────────────────────
const PALETTE = [0x2F6B58, 0x4a6b2f, 0x2f4b6b, 0x6b3a2f, 0x5a2f6b, 0x2f6b5a, 0x6b2f4b, 0x3d5a2f]
let _pi = 0; const _gc = {}
function colorFor(id) { return id in _gc ? _gc[id] : (_gc[id] = PALETTE[_pi++ % PALETTE.length]) }
function initials(n)  { return n.split(/\s+/).map(w => w[0]).join('').toUpperCase().slice(0, 2) }

// ── Building assignment heuristic ─────────────────────────────────────────────
// Maps location name → one of the 8 Tiny Swords building keys.
// Unmatched locations cycle through the remaining pool.
const BUILDING_KEYS = ['Castle','Tavern','Library','Forge','Arena','Chapel','Alchemist','Tower']
let _bPoolIdx = 0; const _bAssign = {}
function buildingFor(locId, name) {
  if (_bAssign[locId]) return _bAssign[locId]
  const n = name.toLowerCase()
  let key
  if      (/water|pool|swim|front|dock/.test(n)) key = 'Forge'
  else if (/art|craft|paint|studio/.test(n))     key = 'Library'
  else if (/arch|range|target/.test(n))          key = 'Arena'
  else if (/fire|circle|pit/.test(n))            key = 'Forge'
  else if (/health|nurse|med|first/.test(n))     key = 'Chapel'
  else if (/bunk|cabin|sleep|dorm/.test(n))      key = 'Tower'
  else if (/din|eat|food|hall|mess|cafe/.test(n)) key = 'Tavern'
  else if (/court|field|sport|ball|gym/.test(n)) key = 'Arena'
  else { key = BUILDING_KEYS[_bPoolIdx % BUILDING_KEYS.length]; _bPoolIdx++ }
  _bAssign[locId] = key
  return key
}

// ── Layout: evenly spaced circle ─────────────────────────────────────────────
function computeLayout(n, cx, cy, r) {
  if (n === 0) return []
  if (n === 1) return [{ x: cx, y: cy - r * 0.3 }]
  return Array.from({ length: n }, (_, i) => {
    const a = (i / n) * Math.PI * 2 - Math.PI / 2
    return { x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) * 0.72 }
  })
}

// ─────────────────────────────────────────────────────────────────────────────
class CampScene extends Phaser.Scene {
  constructor() { super('Camp') }

  // ── Preload ──────────────────────────────────────────────────────────────
  preload() {
    for (const b of BUILDING_KEYS) this.load.image(`bldg-${b}`, `${ASSETS}/buildings/${b}.png`)
    this.load.spritesheet('tree', `${ASSETS}/terrain/Tree.png`, { frameWidth: 192, frameHeight: 192 })
    this.load.image('water-tile', `${ASSETS}/terrain/Water.png`)
    for (let i = 1; i <= 8; i++) this.load.image(`deco${i}`, `${ASSETS}/deco/${i.toString().padStart(2,'0')}.png`)
  }

  // ── Create ───────────────────────────────────────────────────────────────
  create() {
    this.W = this.scale.width
    this.H = this.scale.height
    this.initialized   = false
    this.buildingData  = {}  // locationId → { x, y, capacity, jamRing }
    this.heroData      = {}  // groupId    → { container, bobOffset }
    this.heroTarget    = {}  // groupId    → { x, y }

    this._drawWorld()
    this._connectWS()
  }

  // ── World ────────────────────────────────────────────────────────────────

  _drawWorld() {
    const { W, H } = this
    const rng = makeRng(0xc1ea4)
    const g   = this.add.graphics()

    // ── Forest floor
    g.fillStyle(0x0d1a08); g.fillRect(0, 0, W, H)

    // ── Grass clearing
    const cW = W * 0.84, cH = H * 0.82
    g.fillStyle(0x3a7a28); g.fillEllipse(W/2, H/2, cW, cH)
    // Slight variation patches
    g.fillStyle(0x327222, 0.35); g.fillEllipse(W/2 + W*0.04, H/2 + H*0.04, cW*0.80, cH*0.75)
    g.fillStyle(0x428a30, 0.25); g.fillEllipse(W/2 - W*0.03, H/2 - H*0.05, cW*0.65, cH*0.60)

    // ── Lake (lower-left of clearing)
    const lx = W * 0.21, ly = H * 0.72
    g.fillStyle(0x0e2c42); g.fillEllipse(lx, ly, W*0.16, H*0.14)
    // Tiled water texture
    const waterW = Math.floor(W*0.12 / 64) * 64 + 64
    const waterH = Math.floor(H*0.10 / 64) * 64 + 64
    const waterTile = this.add.tileSprite(lx, ly, waterW, waterH, 'water-tile')
    waterTile.setAlpha(0.72)
    // Lake shadow rim
    g.lineStyle(8, 0x0a2030, 0.7); g.strokeEllipse(lx, ly, W*0.16, H*0.14)

    // ── Dirt paths (drawn before buildings so buildings sit on top)
    this._pathsGraphics = this.add.graphics()

    // ── Scatter deco in clearing
    for (let i = 0; i < 18; i++) {
      const ang = rng() * Math.PI * 2
      const d   = 0.05 + rng() * 0.32
      const px  = W/2 + d * cW/2 * Math.cos(ang)
      const py  = H/2 + d * cH/2 * Math.sin(ang)
      const key = `deco${Math.floor(rng() * 8) + 1}`
      this.add.image(px, py, key).setScale(0.55 + rng() * 0.45).setAlpha(0.85)
    }

    // ── Trees around forest edge (behind buildings, in front of forest floor)
    const rng2 = makeRng(0xf0e52)
    for (let i = 0; i < 48; i++) {
      const ang  = rng2() * Math.PI * 2
      const dist = cW * 0.50 + rng2() * 55
      const tx   = W/2 + dist * Math.cos(ang)
      const ty   = H/2 + dist * Math.sin(ang) * (cH / cW)
      const frame = Math.floor(rng2() * 4)  // 4 tree variants in row 0
      const sc    = 0.28 + rng2() * 0.12
      this.add.image(tx, ty, 'tree', frame).setScale(sc).setOrigin(0.5, 0.85)
    }
  }

  _drawPaths(positions) {
    const { W, H }    = this
    const cx = W/2, cy = H/2
    const rng = makeRng(0x5a17)
    const g   = this._pathsGraphics
    g.clear()

    const seg = (ax, ay, bx, by) => {
      const dx = bx-ax, dy = by-ay, len = Math.sqrt(dx*dx+dy*dy)
      const nx = -dy/len, ny = dx/len, RW = 13

      g.lineStyle(RW+4, 0x0a1006, 0.5); g.lineBetween(ax+2, ay+2, bx+2, by+2)
      g.lineStyle(RW, 0x8a7a58);        g.lineBetween(ax, ay, bx, by)
      // Cobble flecks
      for (let t = 10; t < len - 10; t += 12) {
        const px = ax + (dx/len)*t, py = ay + (dy/len)*t
        const bw = 4 + rng()*4, bh = RW * 0.58
        g.fillStyle(0x9a8a68, 0.45); g.fillRect(px-bw/2, py-bh/2, bw, bh)
        g.lineStyle(0.5, 0x6a5a38, 0.30); g.strokeRect(px-bw/2, py-bh/2, bw, bh)
      }
      g.lineStyle(1, 0x6a5a38, 0.55)
      g.lineBetween(ax+nx*RW/2, ay+ny*RW/2, bx+nx*RW/2, by+ny*RW/2)
      g.lineBetween(ax-nx*RW/2, ay-ny*RW/2, bx-nx*RW/2, by-ny*RW/2)
    }

    // Center plaza
    g.fillStyle(0x8a7a58); g.fillCircle(cx, cy, 28)
    g.lineStyle(1.5, 0x6a5a38, 0.85); g.strokeCircle(cx, cy, 28)
    g.fillStyle(0x1e5070, 0.8);  g.fillCircle(cx, cy, 7) // fountain

    for (const p of positions) seg(cx, cy, p.x, p.y)
    if (positions.length > 2) {
      for (let i = 0; i < positions.length; i++) {
        const a = positions[i], b = positions[(i+1) % positions.length]
        seg(a.x, a.y, b.x, b.y)
      }
    }
  }

  // ── Buildings ────────────────────────────────────────────────────────────

  _initBuildings(locations) {
    const { W, H } = this
    const r        = Math.min(W, H) * 0.29
    const positions = computeLayout(locations.length, W/2, H/2, r)

    this._drawPaths(positions)

    locations.forEach((loc, i) => {
      const pos = positions[i] ?? { x: W/2, y: H/2 }
      const key = `bldg-${buildingFor(loc.id, loc.name)}`
      const img = this.add.image(pos.x, pos.y, key)
        .setScale(0.38)
        .setOrigin(0.5, 0.85)  // anchor at base so building sits on the path

      // Name label below building
      this.add.text(pos.x, pos.y + 10, loc.name, {
        fontSize: '11px', color: '#e8e0cc', fontFamily: 'system-ui',
        stroke: '#080c06', strokeThickness: 3, align: 'center',
      }).setOrigin(0.5, 0)

      this.buildingData[loc.id] = { x: pos.x, y: pos.y, capacity: loc.capacity ?? 1, jamRing: null }
    })
  }

  // ── Heroes ───────────────────────────────────────────────────────────────

  _ensureHero(groupId, groupName) {
    if (this.heroData[groupId]) return
    const col = colorFor(groupId)

    const shadow = this.add.graphics()
    shadow.fillStyle(0x000000, 0.25); shadow.fillCircle(2, 2, 15)

    const circle = this.add.graphics()
    circle.fillStyle(col); circle.fillCircle(0, 0, 15)
    circle.lineStyle(2.5, 0xffffff, 0.28); circle.strokeCircle(0, 0, 15)

    const ini = this.add.text(0, 0, initials(groupName), {
      fontSize: '11px', fontStyle: 'bold', color: '#ffffff',
      fontFamily: 'system-ui', stroke: '#000000', strokeThickness: 2.5,
    }).setOrigin(0.5, 0.5)

    const lbl = this.add.text(0, 22, groupName, {
      fontSize: '9px', color: '#d8cbb0',
      fontFamily: 'system-ui', stroke: '#080c06', strokeThickness: 2.5,
    }).setOrigin(0.5, 0)

    const container = this.add.container(this.W/2, this.H/2 - 80, [shadow, circle, ini, lbl])
    this.heroData[groupId]   = { container, bobOffset: Math.random() * Math.PI * 2 }
    this.heroTarget[groupId] = { x: this.W/2, y: this.H/2 - 80 }
  }

  _placeHeroes(placed) {
    const byLoc = {}
    for (const p of placed) (byLoc[p.locationId] ??= []).push(p)

    const seen = new Set()
    for (const [locId, groups] of Object.entries(byLoc)) {
      const bldg = this.buildingData[locId]
      if (!bldg) continue
      const n = groups.length
      groups.forEach((p, i) => {
        this._ensureHero(p.groupId, p.groupName)
        seen.add(p.groupId)
        const spread = (n - 1) * 24
        const off    = n === 1 ? 0 : (i / (n-1)) * spread - spread/2
        this.heroTarget[p.groupId] = {
          x: bldg.x + off,
          y: bldg.y - 65 - Math.abs(off) * 0.15,
        }
      })

      // Jam ring
      const isJam = n > bldg.capacity
      if (isJam && !bldg.jamRing) bldg.jamRing = this.add.graphics()
      if (bldg.jamRing) {
        bldg.jamRing.clear()
        if (isJam) {
          bldg.jamRing.lineStyle(3.5, 0xff3333, 0.9)
          bldg.jamRing.strokeCircle(bldg.x, bldg.y, 48)
        }
      }
    }

    // Clear jam rings for buildings that are no longer jammed
    for (const [locId, bldg] of Object.entries(this.buildingData)) {
      if (bldg.jamRing && (byLoc[locId]?.length ?? 0) <= bldg.capacity) bldg.jamRing.clear()
    }

    // Park heroes not in this period
    for (const gid of Object.keys(this.heroData)) {
      if (!seen.has(gid)) this.heroTarget[gid] = { x: this.W/2, y: this.H/2 - 95 }
    }
  }

  // ── Game loop ────────────────────────────────────────────────────────────

  update(time) {
    const lerp = 0.075
    for (const [gid, hero] of Object.entries(this.heroData)) {
      const t = this.heroTarget[gid]
      if (!t) continue
      const bob = Math.sin(time * 0.0018 + hero.bobOffset) * 2.8
      const c   = hero.container
      c.x += (t.x - c.x) * lerp
      c.y += (t.y + bob - c.y) * lerp
    }
    for (const bldg of Object.values(this.buildingData)) {
      if (bldg.jamRing) bldg.jamRing.setAlpha(0.5 + Math.sin(time * 0.004) * 0.35)
    }
  }

  // ── WS ───────────────────────────────────────────────────────────────────

  _connectWS() {
    const ws = new WebSocket(`ws://127.0.0.1:${WS_PORT}`)
    ws.onopen = () => {
      document.getElementById('ws-status').textContent = '● Live'
      document.getElementById('ws-status').className = 'ok'
    }
    ws.onmessage = (e) => { try { this._onPayload(JSON.parse(e.data)) } catch {} }
    ws.onclose   = () => {
      document.getElementById('ws-status').textContent = '● Reconnecting…'
      document.getElementById('ws-status').className = 'err'
      setTimeout(() => this._connectWS(), 1500)
    }
    ws.onerror = () => ws.close()
  }

  _onPayload(payload) {
    document.getElementById('period-label').textContent = payload.blockLabel || '—'
    document.getElementById('day-label').textContent   = payload.dayLabel   || ''

    if (!this.initialized && payload.locations?.length) {
      this._initBuildings(payload.locations)
      this.initialized = true
    }
    if (payload.placed) this._placeHeroes(payload.placed)
  }
}

// ── Bootstrap ─────────────────────────────────────────────────────────────────
const TOOLBAR_H = 48
new Phaser.Game({
  type:            Phaser.AUTO,
  parent:          'game-container',
  width:           window.innerWidth,
  height:          window.innerHeight - TOOLBAR_H,
  backgroundColor: '#0d1a08',
  scene:           CampScene,
  antialias:       true,
})
</script>
</body>
</html>
