# The gate, run somewhere other than the developer's laptop.
#
# WHY THIS EXISTS (T191): before this, every gate any session ran competed with the editor, the
# Electron app, and every concurrent agent session on one 4-core machine. Observed 2026-09-16:
# three `npm run verify` processes at once, 1-minute load average 267, and four tests reported as
# FAILING after 1,192,000ms against a 20s timeout — all four passed in 5.8s in isolation. A
# contended machine does not merely slow the gate down; it manufactures reds that look like
# regressions. That is what this removes.
#
# WHY UBUNTU, when the product is a macOS Electron app: the gate never needs Electron. No test
# imports it, no test needs a display, the one mDNS test asserts its wrapper's init options without
# opening a socket, and the integration harness runs in-process libp2p nodes connected by explicit
# dial rather than by discovery. Linux is also the 1x Actions minute multiplier; macOS is 10x.
# `npm run electron:build` is deliberately NOT run here — packaging is a separate concern and would
# be the only thing forcing a macOS runner.
name: gate

# ONLY on pull requests, plus one scheduled run a day on main (T261).
#
# There is deliberately NO `push: branches: [main]` trigger. Measured over 100 runs (2026-09-22 ->
# 2026-09-25): 44 of them were push-to-main, and at least 27 re-verified a tree that had ALREADY
# gone green on a PR run minutes earlier. Merges here are rebased on main before merging, so a
# squash merge produces the same tree as the verified PR head -- main commit 8bfa5a84 and PR head
# 97f2338b both have tree d1703b4175. That was 46% of the bill spent re-running an 11-minute gate
# on a byte-identical checkout, against a 2,000 min/month Free-plan allowance.
#
# The daily run is what makes that safe, and it is not merely a fallback for the rare merge that
# is not a clean rebase. It is the RIGHT instrument for drift in external truth: `npm audit` reads
# a live vulnerability database, so main can go red with no commit in between. A merge-triggered
# run only caught that incidentally, when someone happened to merge.
#
# The cost, stated plainly: a bad DIRECT push to main is now visible within 24 hours rather than
# ~11 minutes. This repository has no branch protection (Free plan), so that is a discipline
# boundary either way, and direct pushes to main are not the practice here.
on:
  pull_request:
  schedule:
    # 09:15 UTC daily. Off the hour on purpose -- the top of the hour is when GitHub's scheduled-run
    # queue is most congested and starts get delayed.
    - cron: '15 9 * * *'
  # So a suspected-stale main can be re-gated on demand without waiting for the schedule.
  workflow_dispatch:

# A PR that gets three pushes should not run three full gates. Cancel superseded runs on the same
# ref — except on main, whose only runs are now the daily scheduled one and workflow_dispatch, and
# neither should cancel the other.
concurrency:
  group: gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # The gate is ~16 min locally on a quiet 4-core machine. 45 gives generous headroom for a cold
    # native build without letting a genuinely hung run burn an hour of minutes.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # This repository's gate tooling is genuinely zsh: ten scripts under scripts/ carry a
      # #!/bin/zsh shebang (gate.sh, integration.sh, the worktree and heal predicates) and eight
      # test files spawn /bin/zsh to exercise them. ubuntu-latest does not ship zsh.
      #
      # Installing it is the honest fix rather than skipping those tests on Linux: the point of CI
      # is to run the same gate, and a suite that quietly drops eight files on the one machine
      # nobody watches is worse than no CI. Found by this workflow's own first run, which failed
      # with "Cannot read properties of undefined (reading 'trim')" — spawnSync returns no stdout
      # when the interpreter is missing, so a missing shell surfaces as a TypeError in a helper
      # rather than as "zsh not found".
      - name: Install zsh (required by the gate's shell tooling)
        run: sudo apt-get update && sudo apt-get install -y zsh

      # Restore node_modules wholesale, keyed on the LOCKFILE, not on anything read from the
      # working environment -- the key is derived from committed state, so a restored tree can only
      # ever be the one this commit's lockfile describes.
      #
      # Worth 117s of a 660s run. better-sqlite3 is the only native dependency and its compiled
      # output lives inside node_modules, so the cache captures the native build too.
      #
      # NO `restore-keys`, deliberately: an EXACT hit or nothing. A partial match would restore some
      # other lockfile's node_modules and then skip the install, which is the one failure mode worth
      # engineering against -- a green gate describing a dependency tree the commit does not declare.
      # On a miss, `npm ci` below runs as it always did, and setup-node's npm cache above still makes
      # that miss cheaper.
      #
      # WHEN THIS ACTUALLY PAYS OFF, because the scoping rule is not obvious. A cache written on a
      # branch is readable from that branch and from the DEFAULT branch's caches -- never from a
      # sibling branch. So a cache written by one PR does nothing for the next PR. The entry every
      # PR reads is the one written by a run on `main`, which since T261 is the daily scheduled run.
      # Consequence: this step is a miss for every PR until `main` has run once (schedule, or a
      # manual workflow_dispatch to prime it), and a miss for any PR that changes the lockfile.
      # Both are correct; neither is a silent fallback.
      - name: Restore node_modules
        id: modules-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node_modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}

      # `npm ci` installs exactly the lockfile. better-sqlite3 is the only native dependency; it
      # builds from source here if no prebuild matches, which is why the toolchain matters and why
      # the setup-node cache above is worth having.
      #
      # Skipped only on an exact cache hit, where node_modules is already byte-for-byte what this
      # lockfile installs.
      - name: Install
        if: steps.modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      # The whole gate, in its real order: agents:check, check:governance, security,
      # test:integration, lint, test. Ordered cheapest-first, so a governance failure is reported in
      # seconds rather than behind ~17 minutes of tests.
      #
      # The serialising lock (scripts/gateLock.js) is left ENABLED rather than bypassed. A runner is
      # a fresh machine with no competing gate, so it acquires immediately and costs nothing — and
      # leaving it on means CI exercises the same code path developers run, instead of a variant
      # that only CI takes.
      - name: npm run verify
        run: npm run verify
