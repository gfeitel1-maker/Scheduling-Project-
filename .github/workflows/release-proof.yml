# Proves the PACKAGED app on the release platforms, and builds the unsigned Windows installer (uploaded as an
# artifact). Deliberately separate from gate.yml and never run
# on pull requests or branch pushes (CI minutes): only on demand or when a release tag is pushed.
# `npm run electron:build` runs scripts/verifyPackagedApp.js --launch as its postelectron:build step,
# which checks that the cipher driver opens a db and node-datachannel constructs a PeerConnection under
# the packaged Electron, that the app boots to the renderer heartbeat, and that it exits within 10s
# of its own app.quit() (and of SIGTERM where that is a real signal, i.e. not Windows).
name: Release proof

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read
  # The final audit's featureIn checks ask gh which PRs a build contains.
  pull-requests: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Windows installer (electron-builder's nsis target, unsigned). It builds release/win-unpacked
          # first, which verifyPackagedApp checks, then wraps it as "Shoresh Setup <version>.exe".
          - os: windows-latest
            builder_args: --win nsis
          - os: macos-14
            builder_args: --mac dir --arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the final audit's featureIn checks ask whether each feature's merge commit is an
          # ancestor of the build; a shallow clone makes every feature look newer than the build.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          # Release builds use Node 22: the encrypting SQLite driver has no prebuilt for, and does not
          # compile under, the pinned Node 25 (see CLAUDE.md "Release builds need a Node that can compile").
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build and verify the packaged app
        # --publish never: on CI electron-builder otherwise tries to publish a GitHub release (and fails with no
        # token). The installer is uploaded as an artifact below instead.
        run: npm run electron:build -- ${{ matrix.builder_args }} --publish never
      # Unsigned by ruling. electron-builder logs "signing with signtool.exe" even with no certificate, so the
      # actual signature state is checked and printed rather than assumed.
      - name: Confirm the Windows installer and app are unsigned
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $files = @(Get-ChildItem release -Filter *.exe) + @(Get-Item 'release/win-unpacked/Shoresh.exe')
          $signed = $false
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature $f.FullName
            Write-Output ("{0}: {1} ({2} bytes)" -f $f.Name, $sig.Status, $f.Length)
            if ($sig.Status -eq 'Valid' -or $sig.SignerCertificate) { $signed = $true }
          }
          if ($signed) { throw 'A Windows binary is signed, but v1 ships unsigned.' }
      # The installer as a downloadable artifact (Windows only; the macOS job proves the bundle, not a release).
      - name: Upload the Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: shoresh-windows-installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30
      # The director audit (scripts/finalAudit) against the packaged Windows app built above, every step. A runner
      # whose network blocks local discovery records the multi-device steps (13, 15, 19, 19b) as "not exercised on
      # CI" (--net-optional) instead of failing them. TEMP points the audit's run directory somewhere uploadable.
      - name: Director audit on the packaged Windows app
        if: runner.os == 'Windows'
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/finalAudit/driver.mjs --app=release/win-unpacked/Shoresh.exe --port=9900 --net-optional
      - name: Upload the director audit results
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: shoresh-windows-audit
          path: ${{ runner.temp }}/shoresh-final-audit/
          if-no-files-found: warn
          retention-days: 30
