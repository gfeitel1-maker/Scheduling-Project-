# T209 Phase A — deployment CONFIGURATION for the owner, not something this repository's
# workflow runs. Nothing in this ticket deploys this Worker, registers a domain, or touches a
# Cloudflare account. See ../README.md for what deploying it requires and who is responsible for
# each piece of it.
#
# This file has no test coverage and is not exercised by `npm run test` — it is inert until an
# owner runs `wrangler deploy` by hand, which is explicitly outside this ticket's scope.

name = "shoresh-rendezvous"
main = "worker.js"
compatibility_date = "2026-09-17"

# Storage: ONE SQLite-backed Durable Object class, one instance per namespace, created on demand by
# env.NAMESPACE_DO.idFromName(namespace). Owner constraint: "i am not making stores for every camp
# uniquely" -- one Worker, one `wrangler deploy`, zero per-camp setup; the migration below ships in
# that same deploy. See docs/adr/2026-10-09-rendezvous-worker-durable-object-storage.md.
[[durable_objects.bindings]]
name = "NAMESPACE_DO"
class_name = "RendezvousNamespace"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RendezvousNamespace"]

# Per-caller rate limiting (Workers Rate Limiting binding; a workers.dev route has no zone, so no
# WAF rule can front it). worker.js keys both on the caller IP and fails CLOSED (503) if a binding
# is missing. BEST-EFFORT only (no guaranteed bound); the exact per-namespace bounds live in the DO. namespace_id is an account-unique integer label, not a secret. Sizing: a device ticks
# once a minute (one register + one peers list), and a camp may put ~20 devices behind one NAT IP,
# so 60 registers / 120 lists per 60s per IP leaves headroom while capping a single abuser.
[[ratelimits]]
name = "REGISTER_LIMITER"
namespace_id = "2091"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "PEERS_LIMITER"
namespace_id = "2092"
simple = { limit = 120, period = 60 }

# See ../README.md — Cloudflare log-retention configuration is an owner deployment decision and is
# NOT expressed in this file, because it is an account/dashboard setting this repository's
# workflow has no authority over.
